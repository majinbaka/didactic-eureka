<head>

<body>
<a href="/">← Về game</a>
<h1>Bách thú Loạn Giới</h1>
<p>30 yêu thú với động tác và chiêu thức riêng. Atlas 20 frame gồm đứng, di chuyển, nhảy, đánh thường, thi triển chiêu, bị thương và gục ngã. Đây là thư viện asset; AI chiến đấu chưa được tích hợp vào màn chơi.</p>
<nav aria-label="Điều khiển xem thử">
<label>Tìm kiếm<input id="query" type="search" placeholder="Tên hoặc chiêu thức…"></label>
<label>Thuộc tính<select id="element" aria-label="Thuộc tính yêu thú"><option value="all">Tất cả</option></select></label>
<label>Động tác<select id="action" aria-label="Động tác" disabled></select></label>
<button id="pause" type="button" disabled>Tạm dừng</button>
<button id="replay" type="button" disabled>Xem lại động tác</button>
</nav>
<p id="status" role="status" aria-live="polite">Đang tải yêu thú…</p>
<section id="grid" aria-label="Bộ sưu tập yêu thú"></section>
<script type="module" src="/beast-gallery.js"></script>
</body></html>
