<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hiệu ứng yêu thú độc lập · Tu Tiên Loạn Giới</title>
<link rel="stylesheet" href="/beast-gallery.css">
<style>canvas{width:256px;height:128px;background:repeating-conic-gradient(#192b26 0% 25%,#243b31 0% 50%) 0 0/16px 16px}article h2{margin-top:18px}.phase-links{display:flex;flex-wrap:wrap}#direction{min-width:120px}</style>
</head>
<body>
<a href="/beasts.html">← Bộ yêu thú</a>
<h1>Chiêu thức tách khỏi thân quái</h1>
<p>30 bộ hiệu ứng trong suốt, mỗi bộ có 5 clip × 4 frame. Chọn Chiêu di chuyển để xem đạn, sóng đất, tia, vòng xoay hoặc chiêu rơi hoạt động độc lập. Chuyển động ở đây là bản minh họa; bạn có thể lấy PNG và manifest để ghép vào game.</p>
<nav aria-label="Điều khiển hiệu ứng">
<label>Tìm kiếm<input id="query" type="search" placeholder="Tên yêu thú hoặc chiêu…"></label>
<label>Pha hiệu ứng<select id="phase" aria-label="Pha hiệu ứng" disabled></select></label>
<label>Hướng<select id="direction" aria-label="Hướng chiêu"><option value="1">Sang phải</option><option value="-1">Sang trái</option></select></label>
<button id="pause" type="button" disabled>Tạm dừng</button>
<button id="replay" type="button" disabled>Phát lại</button>
</nav>
<p id="status" role="status" aria-live="polite">Đang tải hiệu ứng…</p>
<section id="grid" aria-label="30 bộ hiệu ứng yêu thú"></section>
<script type="module" src="/beast-effects.js"></script>
</body></html>
